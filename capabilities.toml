# Skill-Hub capabilities.toml — Agent 工具能力矩阵(13 标签 x 7 Agent)
#
# 四态:
#   supported  - 已证实支持
#   unsupported- 已证实不支持
#   unknown    - 未证实(不编造, emitter 走软警告)
#   partial    - 部分/间接支持(如靠 Skills/MCP 补全)
#
# canonical SKILL.md 的 requires: [tag, ...] 引用这里标签。
# emitter 同步到某 Agent 时:
#   requires 中某 tag 在该 Agent = unsupported -> body 顶插"建议换 Agent"硬警告
#   requires 中某 tag 在该 Agent = unknown    -> 插"未证实"软警告(不阻止执行)
#   body bytes 不动, 前言是 emitter 写盘时拼到 body 之前的独立段。
#
# 能力清单维护:ZCode 全网搜后写入(决策 7); Agent 升级时人工 grep -> 更新该行。

capability_tags = [
    "web_search",
    "web_fetch",
    "image_understanding",
    "image_generation",
    "file_read",
    "file_write",
    "file_edit",
    "code_execute",
    "thinking",
    "tool_use",
    "memory",
    "mcp",
    "doc_generation",
]

[agents.TeleAgent]
web_search = "supported"
web_fetch = "supported"
image_understanding = "supported"
image_generation = "unknown"
file_read = "supported"
file_write = "supported"
file_edit = "supported"
code_execute = "supported"
thinking = "unknown"
tool_use = "supported"
memory = "supported"
mcp = "supported"
doc_generation = "supported"
