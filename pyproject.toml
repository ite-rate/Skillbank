[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub"
version = "0.1.0"
description = "Central skill repository syncing canonical SKILL.md to 7 AI agents via IR (parser->IR->emitter). body byte-identical, no loss."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ss", email = "deepl@example.com" }]
keywords = ["skill", "agent", "sync", "central-repo", "anthropic-skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tomli_w>=1.0",      # 写 TOML(读用 Python 3.11+ 内置 tomllib)
    "questionary>=2.0",  # M6 交互菜单
]

[project.scripts]
skillhub = "skillhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillhub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]