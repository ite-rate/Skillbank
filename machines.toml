# Skillbank machines.toml — 每机器 × 每 Agent 手填 skills 目录完整绝对路径
#
# 决策(2026-08-15, 用户拍板): 显式手填 > home 展开。
#   理由: 同一 Agent 在不同机器路径可能完全不同(实测 QwenWorkCN 在 Mac 是
#   ~/.qwenworkcn/, 换台机器/换个版本/Windows 就变了), "install_dir + home 拼接"
#   的隐式假设不成立。每机器每 Agent 显式填完整路径最稳, 配错在 sync 前就能暴露。
#
# 规则:
#   - skills_dir 必须是完整绝对路径(不用 ~, 不做展开)
#   - 不列某 Agent = 该机器没装该 Agent, sync 时跳过不报错(需求 4.6)
#   - agents.toml 里的 install_dir 只是文档参考, 代码部署路径唯一真相源是本文件
#   - 每台机器首次使用前跑 `skillbank doctor` 验证路径存在性

[machines.mac-main]
display_name = "Mac 主力机"

[machines.mac-main.agents.ClaudeCode]
skills_dir = "/Users/ss/.claude/skills"

[machines.mac-main.agents.ZCode]
skills_dir = "/Users/ss/.zcode/skills"

[machines.mac-main.agents.QwenWorkCN]
skills_dir = "/Users/ss/.qwenworkcn/skills"

[machines.mac-main.agents.TeleAgent]
skills_dir = "/Users/ss/.config/TeleAgent/skills"

[machines.mac-main.agents.Hermes]
skills_dir = "/Users/ss/.hermes/skills"

[machines.mac-main.agents.Codex]
skills_dir = "/Users/ss/.codex/skills"

[machines.mac-main.agents.kimi-code]
skills_dir = "/Users/ss/.kimi-code/skills"

# ------------------------------------------------------------------
# 下面两台机器: TODO 占位, 到那台机器上实测真实路径后填。
# 注意 QwenWorkCN/kimi 这类产品路径不保证跨机器一致, 逐台实测逐台填。
# ------------------------------------------------------------------

